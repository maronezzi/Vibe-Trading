# =====================================================================
# Vibe-Trading — configuração do kit de migração VPS (Hostinger KVM 2)
# Fonte única de caminhos/alvos para os scripts scripts/vps/*.sh.
# Ajuste VT_VPS_SSH após criar o alias em ~/.ssh/config.
# =====================================================================

# Alias SSH da VPS (configurar em ~/.ssh/config, user bruno, porta 22).
# Ex.: Host vps
#        HostName <IP_DA_VPS>
#        User bruno
#        IdentityFile ~/.ssh/id_ed25519
export VT_VPS_SSH="${VT_VPS_SSH:-vps}"

# Caminho do projeto — IGUAL nas duas máquinas (o orquestrador mt5_orchestrator.py
# tem /home/bruno/Projects/Vibe-Trading hardcoded; manter usuário/caminho idênticos
# na VPS evita qualquer mudança de código).
export VT_PROJECT="${VT_PROJECT:-/home/bruno/Projects/Vibe-Trading}"

# Estado essencial do Hermes (gateway + jobs + credenciais de canais).
export VT_HERMES_HOME="${VT_HERMES_HOME:-$HOME/.hermes}"

# Janela de guarda do cutover: fora dela o 40_cutover exige --force.
# Pregão B3: seg-sex 08:30–18:30 (horário de São Paulo).
export VT_GUARD_START="${VT_GUARD_START:-0830}"
export VT_GUARD_END="${VT_GUARD_END:-1830}"

# Destino do espelho noturno VPS → computador (50_mirror_pull).
export VT_MIRROR_DIR="${VT_MIRROR_DIR:-$HOME/Backups/vps-mirror}"

# Host do servidor MT5 da corretora (XP) — extraído da conexão TCP viva do
# terminal64.exe local em 2026-09-03 (Access Server SP, ping local ~6 ms).
export VT_BROKER_HOST="${VT_BROKER_HOST:-170.82.70.117}"
